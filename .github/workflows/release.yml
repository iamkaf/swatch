name: Release

on:
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swatch-release-main
  cancel-in-progress: false

jobs:
  version:
    name: Bump patch version and tag
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Verify source
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Bump patch version and tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin main --tags
          git checkout -B main origin/main

          exact_tag="$(git tag --points-at HEAD --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
          if [[ -n "$exact_tag" ]]; then
            version="${exact_tag#v}"
            if gh release view "$exact_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Swatch $exact_tag is already published."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "version=$version" >> "$GITHUB_OUTPUT"
              echo "tag=$exact_tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tag="$exact_tag"
          else
            latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            if [[ -z "$latest" ]]; then
              version="0.1.0"
            elif [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            else
              echo "Latest release tag is not vMAJOR.MINOR.PATCH: $latest" >&2
              exit 1
            fi
            tag="v$version"

            sed -i -E "0,/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"$/s//version = \"$version\"/" Cargo.toml
            cargo check

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock
            git commit --allow-empty -m "Bump Swatch to $version"
            git tag -a "$tag" -m "Swatch $version"
            git push --atomic origin HEAD:main "refs/tags/$tag"
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.asset }}
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: linux-x86_64
            archive: swatch-linux-x86_64.tar.gz
            binary: swatch
          - os: ubuntu-24.04-arm
            asset: linux-aarch64
            archive: swatch-linux-aarch64.tar.gz
            binary: swatch
          - os: macos-15-intel
            asset: macos-x86_64
            archive: swatch-macos-x86_64.tar.gz
            binary: swatch
          - os: macos-15
            asset: macos-aarch64
            archive: swatch-macos-aarch64.tar.gz
            binary: swatch
          - os: windows-2025
            asset: windows-x86_64
            archive: swatch-windows-x86_64.zip
            binary: swatch.exe

    steps:
      - name: Checkout release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Build
        run: cargo build --release --locked

      - name: Package Unix archive
        if: runner.os != 'Windows'
        env:
          ARCHIVE: ${{ matrix.archive }}
          BINARY: ${{ matrix.binary }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp "target/release/$BINARY" LICENSE README.md dist/package/
          tar -C dist/package -czf "dist/$ARCHIVE" "$BINARY" LICENSE README.md

      - name: Package Windows archive
        if: runner.os == 'Windows'
        env:
          ARCHIVE: ${{ matrix.archive }}
          BINARY: ${{ matrix.binary }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item "target/release/$env:BINARY", LICENSE, README.md dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/$env:ARCHIVE"

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        run: cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Swatch $VERSION" \
            --generate-notes
