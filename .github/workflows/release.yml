name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already recorded in Cargo.toml, such as 0.3.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: swatch-release
  cancel-in-progress: false

jobs:
  check:
    name: Verify release source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Validate explicit version
        id: version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          cargo_version="$(sed -n '0,/^version = "/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          test "$VERSION" = "$cargo_version"
          tag="v$VERSION"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify source
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  build:
    name: Build ${{ matrix.asset }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: linux-x86_64
            archive: swatch-linux-x86_64.tar.gz
            binary: swatch
          - os: ubuntu-24.04-arm
            asset: linux-aarch64
            archive: swatch-linux-aarch64.tar.gz
            binary: swatch
          - os: macos-15-intel
            asset: macos-x86_64
            archive: swatch-macos-x86_64.tar.gz
            binary: swatch
          - os: macos-15
            asset: macos-aarch64
            archive: swatch-macos-aarch64.tar.gz
            binary: swatch
          - os: windows-2025
            asset: windows-x86_64
            archive: swatch-windows-x86_64.zip
            binary: swatch.exe

    steps:
      - name: Checkout release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Build
        run: cargo build --release --locked

      - name: Package Unix archive
        if: runner.os != 'Windows'
        env:
          ARCHIVE: ${{ matrix.archive }}
          BINARY: ${{ matrix.binary }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp "target/release/$BINARY" LICENSE README.md dist/package/
          tar -C dist/package -czf "dist/$ARCHIVE" "$BINARY" LICENSE README.md

      - name: Package Windows archive
        if: runner.os == 'Windows'
        env:
          ARCHIVE: ${{ matrix.archive }}
          BINARY: ${{ matrix.binary }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item "target/release/$env:BINARY", LICENSE, README.md dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/$env:ARCHIVE"

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Sign, verify, and publish
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download archives
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
          merge-multiple: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: v3.0.2

      - name: Write release manifest
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          artifacts="$({
            find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%f\n' \
              | sort \
              | while read -r name; do
                  case "$name" in
                    *.tar.gz) media_type='application/gzip' ;;
                    *.zip) media_type='application/zip' ;;
                  esac
                  jq -n \
                    --arg path "$name" \
                    --arg mediaType "$media_type" \
                    --arg sha256 "$(sha256sum "dist/$name" | cut -d' ' -f1)" \
                    --arg sha512 "$(sha512sum "dist/$name" | cut -d' ' -f1)" \
                    '{path: $path, mediaType: $mediaType, sha256: $sha256, sha512: $sha512}'
                done
          } | jq -s .)"
          jq -n \
            --arg version "$VERSION" \
            --arg sourceRevision "$GITHUB_SHA" \
            --argjson artifacts "$artifacts" \
            '{schemaVersion: 1, version: $version, sourceRevision: $sourceRevision, artifacts: $artifacts}' \
            > dist/release-manifest.json

      - name: Sign release manifest
        run: |
          cosign sign-blob --yes \
            --bundle dist/release-manifest.sigstore.json \
            dist/release-manifest.json

      - name: Attest archives
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Verify release inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -r '.artifacts[] | [.path, .sha256, .sha512] | @tsv' dist/release-manifest.json \
            | while IFS=$'\t' read -r path sha256 sha512; do
                printf '%s  %s\n' "$sha256" "dist/$path" | sha256sum --check --strict
                printf '%s  %s\n' "$sha512" "dist/$path" | sha512sum --check --strict
              done
          cosign verify-blob \
            --bundle dist/release-manifest.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/release-manifest.json
          for archive in dist/*.tar.gz dist/*.zip; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "$TAG" \
            dist/*.tar.gz \
            dist/*.zip \
            dist/release-manifest.json \
            dist/release-manifest.sigstore.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Swatch $VERSION" \
            --generate-notes
